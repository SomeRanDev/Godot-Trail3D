[package]
name = "godot_trail_3d"
authors = ["Maybee \"SomeRanDev\" Rezbit"]
description = "A native Godot addon that adds a Trail3D node to Godot."
version = "1.0.0"
edition = "2021"
readme = "README.md"
license = "MIT"
keywords = ["godot", "gamedev"]

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.3", features=["api-custom", "experimental-wasm", "lazy-function-tables"] }

[features]
nothreads = ["godot/experimental-wasm-nothreads"]
